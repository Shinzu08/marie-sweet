<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Menu</title>
    <style>
        /* Pink Theme Colors */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #fff0f5; /* Very light pink background */
            padding-bottom: 250px; /* Space for the cart at the bottom */
        }

        /* Container for the menu grid */
        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* Box for each item with a pink shadow */
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.2); /* Pink shadow */
            width: 220px;
            border: 1px solid #ffb6c1;
        }

        /* Picture styling */
        .menu-item img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Button Container */
        .item-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
        }

        /* Pink Add Button */
        .add-btn {
            background-color: #ff69b4; /* Hot Pink */
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 48%;
            transition: 0.2s;
        }

        .add-btn:hover {
            background-color: #ff1493; /* Deeper Pink */
        }

        /* Light Pink Cancel Button */
        .cancel-btn {
            background-color: #ffb6c1; /* Light Pink */
            color: #333;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 48%;
            transition: 0.2s;
        }

        .cancel-btn:hover {
            background-color: #ff69b4;
            color: white;
        }

        /* --- SHOPPING CART STYLES (Pink Theme) --- */
        .cart-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            box-shadow: 0 -4px 15px rgba(255, 105, 180, 0.3); /* Pink shadow */
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
            box-sizing: border-box;
            border-top: 3px solid #ff69b4;
        }

        .cart-title {
            margin-top: 0;
            font-size: 18px;
            color: #ff1493;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 10px;
        }

        .cart-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #ffe4e1;
        }

        /* Cancel Button inside the Cart */
        .cart-cancel-btn {
            background-color: #ffb6c1;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-cancel-btn:hover {
            background-color: #ff69b4;
            color: white;
        }

        .empty-cart {
            color: #ff69b4;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="menu-grid">
        
        <!-- Item 1 -->
        <div class="menu-item">
            <img src="cappuccino.jpg.PNG" alt="Cappuccino">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Cappuccino')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="menu-item">
            <img src="cascada.jpg.PNG" alt="Cascada">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Cascada')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="menu-item">
            <img src="cheesecake.jpg.PNG" alt="Cheesecake">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Cheesecake')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="menu-item">
            <img src="cocktail.jpg.png" alt="Cocktail">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Cocktail')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 5 -->
        <div class="menu-item">
            <img src="crepe.jpg.PNG" alt="Crepe">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Crepe')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 6 -->
        <div class="menu-item">
            <img src="dessert.jpg.PNG" alt="Dessert">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Dessert')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 7 -->
        <div class="menu-item">
            <img src="gaufre.jpg.PNG" alt="Gaufre">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Gaufre')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 8 -->
        <div class="menu-item">
            <img src="iced.jpg.PNG" alt="Iced">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Iced')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 9 -->
        <div class="menu-item">
            <img src="jus.jpg.PNG" alt="Jus">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Jus')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 10 -->
        <div class="menu-item">
            <img src="milkshake.jpg.PNG" alt="Milkshake">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Milkshake')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

        <!-- Item 11 -->
        <div class="menu-item">
            <img src="mocktail.jpg.PNG" alt="Mocktail">

                <button class="add-btn" onclick="addToCart('Mocktail')">Add</button>

            </div>
        </div>

        <!-- Item 12 -->
        <div class="menu-item">
            <img src="mojito.jpg.PNG" alt="Mojito">
            <div class="item-buttons">
                <button class="add-btn" onclick="addToCart('Mojito')">Add</button>
                <button class="cancel-btn" onclick="cancelItem()">Cancel</button>
            </div>
        </div>

    </div>

    <!-- THE SHOPPING CART (Fixed at the bottom of the screen) -->
    <div class="cart-container">
        <h3 class="cart-title">Your Order:</h3>
        <ul class="cart-list" id="cartList">
            <li class="empty-cart">Cart is empty. Tap Add to order!</li>
        </ul>
    </div>

    <!-- JAVASCRIPT FOR THE ORDERING LOGIC -->
    <script>
        let order = [];

        // This function handles the green "Add" button
        function addToCart(itemName) {
            order.push(itemName);
            updateCartDisplay();
        }

        // This function handles the red "Cancel" button under the menu item
        function cancelItem() {
            if (order.length > 0) {
                // Removes the last item added to the cart
                order.pop();
                updateCartDisplay();
            }
        }

        // This function handles the "Cancel" button inside the cart list
        function removeFromCart(index) {
            order.splice(index, 1);
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const cartList = document.getElementById('cartList');
            cartList.innerHTML = '';

            if (order.length === 0) {
                cartList.innerHTML = '<li class="empty-cart">Cart is empty. Tap Add to order!</li>';
                return;
            }

            order.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                
                // Pink cancel button for the cart
                li.innerHTML = `
                    <span>${item}</span>
                    <button class="cart-cancel-btn" onclick="removeFromCart(${index})">Cancel</button>
                `;
                
                cartList.appendChild(li);
            });
        }
    </script>

</body>
</html>
