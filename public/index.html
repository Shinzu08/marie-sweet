<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        .menu-item {
            margin-bottom: 20px;
        }

        /* Styles for the form */
        form {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            max-width: 400px;
        }

        input {
            display: block;
            margin-bottom: 15px;
            padding: 8px;
            width: 90%;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button, .cancel-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 16px;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        /* Styles for the Cancel button */
        .cancel-btn {
            background-color: #f44336;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Our Menu</h1>

    <!-- MENU SECTION -->
    <div class="menu-item">
        <h3>Cappuccino</h3>
        <!-- FIXED: Added .PNG to match your files -->
        <img src="cappuccino.jpg.PNG" alt="Cappuccino" width="200">
    </div>

    <div class="menu-item">
        <h3>Cascada</h3>
        <img src="cascada.jpg.PNG" alt="Cascada" width="200">
    </div>

    <div class="menu-item">
        <h3>Cheesecake</h3>
        <img src="cheesecake.jpg.PNG" alt="Cheesecake" width="200">
    </div>

    <div class="menu-item">
        <h3>Cocktail</h3>
        <!-- This one has lowercase .png based on your screenshot -->
        <img src="cocktail.jpg.png" alt="Cocktail" width="200">
    </div>

    <div class="menu-item">
        <h3>Crepe</h3>
        <img src="crepe.jpg.PNG" alt="Crepe" width="200">
    </div>

    <div class="menu-item">
        <h3>Dessert</h3>
        <img src="dessert.jpg.PNG" alt="Dessert" width="200">
    </div>

    <div class="menu-item">
        <h3>Gaufre</h3>
        <img src="gaufre.jpg.PNG" alt="Gaufre" width="200">
    </div>

    <div class="menu-item">
        <h3>Iced Coffee</h3>
        <img src="iced.jpg.PNG" alt="Iced Coffee" width="200">
    </div>

    <div class="menu-item">
        <h3>Jus</h3>
        <img src="jus.jpg.PNG" alt="Jus" width="200">
    </div>

    <div class="menu-item">
        <h3>Milkshake</h3>
        <img src="milkshake.jpg.PNG" alt="Milkshake" width="200">
    </div>

    <div class="menu-item">
        <h3>Mocktail</h3>
        <img src="mocktail.jpg.PNG" alt="Mocktail" width="200">
    </div>

    <div class="menu-item">
        <h3>Mojito</h3>
        <img src="mojito.jpg.PNG" alt="Mojito" width="200">
    </div>


    <!-- ORDER FORM WITH CANCEL BUTTON -->
    <h2>Place an Order</h2>
    <form action="#" method="POST">
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label for="order">What would you like?</label>
        <input type="text" id="order" name="order" placeholder="e.g., Cappuccino and Cheesecake">

        <div class="button-group">
            <!-- Submit Button -->
            <button type="submit">Submit Order</button>
            
            <!-- Cancel Button (It's a link that takes you back to the home page or clears the form) -->
            <a href="/" class="cancel-btn">Cancel</a>
        </div>
    </form>

</body>
</html>
