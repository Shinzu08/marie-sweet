<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marie Sweet — Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Beautiful Pink Background */
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background-color: #fff0f5; 
      background-image: radial-gradient(#f8bbd0 1px, transparent 1px);
      background-size: 20px 20px;
      color: #4a3b3b; 
      padding: 16px; 
      padding-bottom: 100px; 
      max-width: 600px; 
      margin: 0 auto; 
    }
    
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 34px; color: #d81b60; font-weight: 800; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
    .table-badge { display: inline-block; background: #d81b60; color: white; padding: 8px 18px; border-radius: 20px; font-size: 15px; margin-top: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(216,27,96,0.2); }

    /* Category Tabs */
    .categories { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: white; color: #d81b60; border: 1px solid #f8bbd0; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-btn.active { background: #d81b60; color: white; border-color: #d81b60; box-shadow: 0 4px 8px rgba(216,27,96,0.3); }

    /* Menu Items */
    .item { background: white; border-radius: 16px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; box-shadow: 0 4px 12px rgba(216,27,96,0.08); border: 1px solid #fce4ec; }
    .item-img { width: 75px; height: 75px; object-fit: cover; border-radius: 12px; margin-right: 15px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .item-info { flex-grow: 1; }
    .item-info h3 { font-size: 16px; margin-bottom: 4px; font-weight: 700; }
    .price { color: #d81b60; font-weight: 800; font-size: 15px; }
    
    /* Buttons */
    .add-btn { background: #d81b60; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(216,27,96,0.3); }
    .minus-btn { background: #fce4ec; color: #d81b60; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    
    /* Bottom Bar */
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #4a3b3b; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); z-index: 100; }
    .cart-bar span { font-weight: bold; font-size: 16px; }
    .cart-bar button { background: #d81b60; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 8px rgba(216,27,96,0.3); }
    .cart-bar button:active { transform: scale(0.95); }

    /* Confirmation Screen */
    .confirmation-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
    .confirm-content { background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .check-icon { font-size: 60px; margin-bottom: 10px; }
    .confirm-content h2 { color: #d81b60; margin-bottom: 5px; font-size: 26px; }
    .confirm-content p { color: #888; font-size: 15px; margin-bottom: 20px; }
    
    .receipt { background: #fff0f5; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; max-height: 250px; overflow-y: auto; border: 1px dashed #f8bbd0; }
    .receipt-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: #4a3b3b; }
    .receipt-total { border-top: 1px dashed #f8bbd0; margin-top: 15px; padding-top: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; color: #d81b60; }
    
    .close-btn { background: #4a3b3b; color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>🌸 Marie Sweet</h1>
    <div class="table-badge" id="tableBadge">Table —</div>
  </header>

  <div class="categories" id="categories"></div>
  <div id="menu"></div>

  <!-- Bottom Cart Bar -->
  <div class="cart-bar hidden" id="cartBar">
    <span id="cartTotal">0 DA</span>
    <button onclick="placeOrder()">Order Now</button>
  </div>

  <!-- Order Confirmation Pop-up -->
  <div id="confirmationScreen" class="confirmation-screen hidden">
    <div class="confirm-content">
      <div class="check-icon">✅</div>
      <h2>Order Sent!</h2>
      <p>Your order is being prepared.</p>
      
      <div class="receipt" id="receiptDetails">
        <!-- Order details will go here -->
      </div>
      
      <button onclick="closeConfirmation()" class="close-btn">Back to Menu</button>
    </div>
  </div>

      // Snacks
      { id: 51, name: 'Snack Yummy', price: 450, cat: 'Snacks', img: 'snack.jpg' },

      // Cheesecake
      { id: 54, name: 'Cheesecake Nutella', price: 450, cat: 'Cheesecakes', img: 'cheesecake.jpg' },
      { id: 55, name: 'Cheesecake Lotus', price: 500, cat: 'Cheesecakes', img: 'cheesecake.jpg' },
      { id: 56, name: 'Cheesecake Fruits de Bois', price: 450, cat: 'Cheesecakes', img: 'cheesecake.jpg' },
      { id: 57, name: 'Cheesecake Bueno', price: 500, cat: 'Cheesecakes', img: 'cheesecake.jpg' },
      { id: 58, name: 'Cake Dubai', price: 700, cat: 'Cheesecakes', img: 'cheesecake.jpg' },

      // Tiramissu
      { id: 59, name: 'Tiramissu Classique', price: 350, cat: 'Tiramissu', img: 'tiramisu.jpg' },
      { id: 60, name: 'Tiramissu Nutella', price: 450, cat: 'Tiramissu', img: 'tiramisu.jpg' },
      { id: 61, name: 'Tiramissu Marie', price: 500, cat: 'Tiramissu', img: 'tiramisu.jpg' },

      // Cascada
      { id: 62, name: 'Cascada Simple', price: 400, cat: 'Cascada', img: 'cascada.jpg' },
      { id: 63, name: 'Cascada Royale', price: 450, cat: 'Cascada', img: 'cascada.jpg' },
      { id: 64, name: 'Cascada Dubai', price: 550, cat: 'Cascada', img: 'cascada.jpg' },
      { id: 65, name: 'Cascada Marie', price: 700, cat: 'Cascada', img: 'cascada.jpg' },
      
      // Les Boissons
      { id: 66, name: 'Canettes de Coca-Cola', price: 150, cat: 'Les Boissons' },
      { id: 67, name: 'L\'eau Petite Bouteille', price: 30, cat: 'Les Boissons' },
      { id: 68, name: 'L\'eau Grande Bouteille', price: 50, cat: 'Les Boissons' }
    ];

    const CATEGORIES = ['All', 'Boissons Chaudes', 'Jus', 'Cocktails', 'Mocktails', 'Milkshakes', 'Iced Drinks', 'Mojitos', 'Crêpes', 'Pancakes', 'Gaufres', 'Desserts', 'Snacks', 'Cheesecakes', 'Tiramissu', 'Cascada', 'Les Boissons'];

    const params = new URLSearchParams(location.search);
    const TABLE = params.get('table') || '?';
    document.getElementById('tableBadge').textContent = `Table ${TABLE}`;

    let cart = {};
    let currentCategory = 'All';

    document.getElementById('categories').innerHTML = CATEGORIES.map(cat => `
      <button class="cat-btn ${cat === 'All' ? 'active' : ''}" onclick="filterMenu('${cat}', this)">${cat}</button>
    `).join('');

    function filterMenu(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function renderMenu() {
      const filteredItems = MENU.filter(item => currentCategory === 'All' || item.cat === currentCategory);
      
      document.getElementById('menu').innerHTML = filteredItems.map(item => {
        const qty = cart[item.id] || 0;
        return `
        <div class="item">
          ${item.img ? `<img src="${item.img}" class="item-img" alt="${item.name}" onerror="this.style.display='none'">` : ''}
          <div class="item-info">
            <h3>${item.name}</h3>
            <span class="price">${item.price} DA</span>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            ${qty > 0 ? `<button class="minus-btn" onclick="removeFromCart(${item.id})">−</button>` : ''}
            <span style="font-weight: 800; font-size: 16px; min-width: 20px; text-align: center; color: #d81b60;">${qty > 0 ? qty : ''}</span>
            <button class="add-btn" onclick="addToCart(${item.id})">+</button>
          </div>
        </div>
      `}).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCart();
      renderMenu();
    }

    function removeFromCart(id) {
      if (cart[id]) {
        cart[id] -= 1;
        if (cart[id] === 0) delete cart[id];
        updateCart();
        renderMenu();
      }
    }

    function updateCart() {
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      let total = 0;
      for (const id in cart) {
        const item = MENU.find(m => m.id == id);
        total += item.price * cart[id];
      }
      document.getElementById('cartBar').classList.toggle('hidden', count === 0);
      document.getElementById('cartTotal').textContent = `${count} items — ${total} DA`;
    }

    async function placeOrder() {
      const items = Object.keys(cart).map(id => {
        const item = MENU.find(m => m.id == id);
        return { name: item.name, price: item.price, qty: cart[id] };
      });
      const total = items.reduce((sum, i) => sum + i.price * i.qty, 0);

      const button = document.querySelector('.cart-bar button');
      button.textContent = "Sending...";
      button.disabled = true;

      try {
        const res = await fetch('/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ table: TABLE, items, total })
        });
        if (!res.ok) throw new Error();

        let receiptHTML = `<h3 style="margin-bottom:10px; font-size:18px; color: #d81b60; text-align: center;">Table ${TABLE}</h3>`;
        items.forEach(i => {
          receiptHTML += `<div class="receipt-item"><span>${i.qty}x ${i.name}</span> <span>${i.price * i.qty} DA</span></div>`;
        });
        receiptHTML += `<div class="receipt-total"><span>Total</span> <span>${total} DA</span></div>`;
        
        document.getElementById('receiptDetails').innerHTML = receiptHTML;
        document.getElementById('confirmationScreen').classList.remove('hidden');

        cart = {};
        updateCart();
        renderMenu();

      } catch {
        alert('❌ Could not send order. Please call the waiter.');
      } finally {
        button.textContent = "Order Now";
        button.disabled = false;
      }
    }

    function closeConfirmation() {
      document.getElementById('confirmationScreen').classList.add('hidden');
    }

    renderMenu();
  </script>
</body>
</html>
